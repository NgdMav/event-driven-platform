spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:fit}
    password: ${DB_PASSWORD:fit_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: 8081

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:local-dev-secret-local-dev-secret-local-dev-secret}
    access-token-ttl-seconds: 900
  refresh-token-ttl-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html