spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            - id: profile-service
              uri: ${PROFILE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/profile/**

            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/catalog/**

            - id: workout-service
              uri: ${WORKOUT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/workouts/**

server:
  port: 8080

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:local-dev-secret-local-dev-secret-local-dev-secret}

gateway:
  security:
    public-paths:
      - /api/auth/register
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/logout
      - /api/catalog/**
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always