spring:
  application:
    name: catalog-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/catalog_db}
    username: ${DB_USERNAME:fit}
    password: ${DB_PASSWORD:fit_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html