services:
  auth-db:
    image: postgres:latest
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: fit
      POSTGRES_PASSWORD: fit_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fit -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  profile-db:
    image: postgres:latest
    container_name: profile-db
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: fit
      POSTGRES_PASSWORD: fit_password
    ports:
      - "5433:5432"
    volumes:
      - profile-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fit -d profile_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10

#  ./mvnw spring-boot:build-image "-Dspring-boot.build-image.imageName=ngdmav/fitnessapp-auth-service"
  auth-service:
    image: ngdmav/fitnessapp-auth-service
    container_name: auth-service
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_USERNAME: fit
      DB_PASSWORD: fit_password
      AUTH_JWT_SECRET: local-dev-secret-local-dev-secret-local-dev-secret
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  auth-db-data:
  profile-db-data: